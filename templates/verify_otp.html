<!DOCTYPE html>
<html>
<head>
    <title>Verify Your Email - ACiD'S TREATS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-hero">
        <div class="auth-card">
            <h1 class="auth-logo">ACiD'S <span>TREATS</span></h1>
            <p class="auth-tagline">Good Food, Happy Mood</p>

            <h2>Verify Your Email</h2>
            <p class="auth-desc">Enter the 6-digit code we sent to your email.</p>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}

            <form method="POST"  action="{{ url_for('verify_otp')}}" class="auth-form-dark">
                <label>Verification Code</label>
                <input type="text" name="otp" maxlength="6" placeholder="Enter 6-digit code" required
                       style="letter-spacing: 6px; text-align: center; font-size: 20px;">

                <button type="submit" class="btn auth-submit">Verify</button>
            </form>

            <p class="auth-switch">Didn't get it? <a href="/resend-otp">Resend code</a></p>
        </div>
    </div>
</body>
</html>
