<!DOCTYPE html>
<html>
<head>
    <title>ACiD'S TREATS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>ACiD'S TREATS</h1>
    <p><a href="/cart">View Cart</a></p>
    <p><a href="/history">Order History</a></p>
    <ul>
               {% for item in menu_items %}
            <li>
                {{ item.name }} - {{ item.price }}
                <form action="/add_order" method="POST" style="display:inline;">
                    <input type="hidden" name="food" value="{{ item.name }}">
                    <input type="number" name="quantity" value="1" min="1" style="width:50px;">
                    <input type="text" name="notes" placeholder="e.g. no onions" style="width:120px;">
                    <button type="submit">Add</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
