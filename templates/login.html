<!DOCTYPE html>
<html>
<head>
    <title>Log In - ACiD'S TREATS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-hero">
        <div class="auth-card">
            <h1 class="auth-logo">ACiD'S <span>TREATS</span></h1>
            <p class="auth-tagline">Good Food, Happy Mood</p>

            <h2>Welcome Back</h2>
            <p class="auth-desc">Log in to continue enjoying your favorite meals.</p>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}

            <form method="POST" class="auth-form-dark">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>

                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
                <p class="forgot-password-link"><a href="/forgot-password">Forgot Password?</a></p>

                <button type="submit" class="btn auth-submit">Log In</button>
            </form>
                <div class="auth-divider"><span>or continue with</span></div>

                <div class="social-auth">
                    <button type="button" class="social-btn" disabled>
                        <img src="https://www.google.com/favicon.ico" alt="Google" class="social-icon">
                        Google
                    </button>
                    <button type="button" class="social-btn" disabled>
                        <span class="social-icon">📘</span>
                        Facebook
                    </button>
                    <button type="button" class="social-btn" disabled>
                        <span class="social-icon"></span>
                        Apple
                    </button>
                </div>
            <p class="auth-switch-dark">Don't have an account? <a href="/signup">Sign Up</a></p>
        </div>
    </div>
</body>
</html>
