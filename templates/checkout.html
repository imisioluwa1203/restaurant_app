<!DOCTYPE html>
<html>
<head>
    <title>Checkout - ACiD'S TREATS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Your Receipt</h1>

    {% if ordered_food %}
        <ul>
            {% for item in ordered_food %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>
        <p class="total">Total: {{ total }}</p>
        <form action="/place_order" method="POST">
                <p>
                    <label><input type="radio" name="order_type" value="Delivery" checked> Delivery</label>
                    <label style="margin-left:15px;"><input type="radio" name="order_type" value="Pickup"> Pickup</label>
                </p>
                 <button type="submit">Place Order</button>
        </form>
    {% else %}
        <p>Your cart is empty — nothing to check out.</p>
    {% endif %}

    <p><a href="/cart">Back to Cart</a></p>
</body>
</html>
