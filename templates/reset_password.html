<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - ACiD'S TREATS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-hero">
        <div class="auth-card">
            <h1 class="auth-logo">ACiD'S <span>TREATS</span></h1>
            <h2>Set New Password</h2>
            <p class="auth-desc">Choose a new password for your account.</p>

            <form method="POST" class="auth-form-dark">
                <label>New Password</label>
                <input type="password" name="new_password" placeholder="Enter new password" required>
                <button type="submit" class="btn auth-submit">Reset Password</button>
            </form>
        </div>
    </div>
</body>
</html>
