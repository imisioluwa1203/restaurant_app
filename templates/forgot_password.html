<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - ACiD'S TREATS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-hero">
        <div class="auth-card">
            <h1 class="auth-logo">ACiD'S <span>TREATS</span></h1>
            <h2>Forgot Password</h2>
            <p class="auth-desc">Enter your username and email to reset your password.</p>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}
            {% if success %}
              <p class="success-msg">Check your email for a password reset link.</p>
            {% endif %}
            <form method="POST" class="auth-form-dark">
                <label>Username</label>
                <input type="text" name="username" placeholder="Your username" required>

                <label>Email</label>
                <input type="email" name="email" placeholder="Your email" required>

                <button type="submit" class="btn auth-submit">Continue</button>
            </form>

            <p class="auth-switch-dark"><a href="/login">Back to login</a></p>
        </div>
    </div>
</body>
</html>
